server {
  listen 80;
  root /usr/share/nginx/html;

  location = / {
    try_files /index.html =404;
  }

  # Built JS/CSS from Vite. File names contain a content hash, so they can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else (/api/*, /<code>, /healthz) goes to the server, like the ALB will on EKS
  location / {
    resolver 127.0.0.11 valid=10s;  # Docker DNS: re-resolve so a restarted server (new IP) is found
    set $upstream http://server:3000;
    proxy_pass $upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
