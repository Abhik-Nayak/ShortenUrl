services:
  db:
    image: postgres:16-alpine
    container_name: shortenurl-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shorten}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shorten}
      POSTGRES_DB: ${POSTGRES_DB:-shortenurl}
    ports:
      # host:container. 5433 on the host because a local Postgres already uses 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Named volume: data survives `docker compose down` (only `down -v` deletes it).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
