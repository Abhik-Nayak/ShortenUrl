services:
  server:
    build: ./server
    env_file: ./server/.env
    restart: always
    networks:
      - app-net

  client:
    build: ./client
    restart: always
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - client
    restart: always
    networks:
      - app-net

networks:
  app-net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:db8::/64
