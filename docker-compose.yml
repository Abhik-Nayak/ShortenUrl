services:
  server:
    build: ./server
    env_file: ./server/.env
    restart: always

  client:
    build: ./client
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - server
      - client
    restart: always
