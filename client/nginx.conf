# Nginx sits in front of everything and decides where each request goes.
#
# It has two jobs:
#   1. Send back the React files (HTML, JS, CSS) that were built by "npm run build".
#   2. Forward anything that is not a React page to the Node API container.
#
# Both the website and the API are on the same address (http://localhost:8080),
# which is what the React code expects - it calls "/api/v1/..." with no hostname.

server {
  listen 80;

  # Where the built React files live inside this container.
  # The Dockerfile copied them here from the build stage.
  root /usr/share/nginx/html;

  # The compiled JS/CSS bundles. Their names contain a hash, so when the file
  # changes the name changes too - that makes it safe to cache for a long time.
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 1y;
  }

  # ---------------------------------------------------------------------------
  # React pages.
  #
  # React Router handles these in the browser, so nginx just returns index.html
  # and lets React figure out which page to show.
  #
  # IMPORTANT: this list must match the RESERVED list in
  # server/src/services/url.service.ts. Both files are protecting the same thing:
  # a short code and a page name look identical in a URL (/login vs /ctyVO56),
  # so "login" must never be usable as a short code.
  # If you add a page here, add it there too.
  # ---------------------------------------------------------------------------
  location = /         { try_files /index.html =404; }
  location = /login    { try_files /index.html =404; }
  location = /register { try_files /index.html =404; }
  location /urls       { try_files /index.html =404; }

  # Small files the browser asks for by name.
  location = /favicon.ico { try_files $uri =404; access_log off; }
  location = /favicon.svg { try_files $uri =404; access_log off; }
  location = /robots.txt  { try_files $uri =404; access_log off; }

  # ---------------------------------------------------------------------------
  # The API.
  #
  # "api" is the service name from docker-compose.yml. Docker turns that name
  # into the container's IP address automatically, so we do not need to know it.
  # Port 5000 is the port INSIDE that container.
  # ---------------------------------------------------------------------------
  location /api/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    access_log off;
  }

  # ---------------------------------------------------------------------------
  # Everything else is treated as a short code, for example /ctyVO56.
  # The API looks it up in the database and answers with a redirect.
  #
  # X-Forwarded-For passes on the real visitor's IP address. Without it the API
  # would see nginx's IP for every visitor, and the "unique visitors" count in
  # the analytics page would always be 1.
  # ---------------------------------------------------------------------------
  location / {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
